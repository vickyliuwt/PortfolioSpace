# ci pipeline
# stage 1 lint, stage 2 tests (with mongo + redis + elasticsearch), stage 3 build

name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint client
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: client/package-lock.json
      - name: Install
        working-directory: client
        run: npm ci || npm install
      - name: Lint
        working-directory: client
        run: npx next lint || echo "lint warnings only"

  server-tests:
    name: Server tests (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]

    services:
      mongo:
        image: mongo:8
        ports: ["27017:27017"]
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.adminCommand({ping:1}).ok'"
          --health-interval 10s --health-timeout 5s --health-retries 10
      redis:
        image: redis:8-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s --health-timeout 3s --health-retries 10
      elasticsearch:
        image: docker.elastic.co/elasticsearch/elasticsearch:9.0.0
        ports: ["9200:9200"]
        env:
          discovery.type: single-node
          xpack.security.enabled: "false"
          ES_JAVA_OPTS: -Xms512m -Xmx512m
        options: >-
          --health-cmd "curl -fs http://localhost:9200/_cluster/health || exit 1"
          --health-interval 15s --health-timeout 5s --health-retries 12

    env:
      NODE_ENV: test
      MONGO_URL: mongodb://127.0.0.1:27017/portfoliospace_test
      REDIS_URL: redis://127.0.0.1:6379
      ES_URL: http://127.0.0.1:9200
      SESSION_SECRET: ci_secret
      JWT_SECRET: ci_jwt_secret

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: server/package-lock.json
      - name: Install
        working-directory: server
        run: npm ci || npm install
      - name: Syntax check every service
        working-directory: server
        run: |
          for f in $(find . -name "*.js" -not -path "*/node_modules/*"); do node --check "$f"; done
      - name: Tests with coverage
        working-directory: server
        run: npm run test:coverage --if-present
      - name: Keep the coverage report
        if: matrix.node == 24
        uses: actions/upload-artifact@v4
        with:
          name: server-coverage
          path: server/services/*/coverage/lcov-report
          if-no-files-found: ignore

  client-tests:
    name: Client tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: client/package-lock.json
      - name: Install
        working-directory: client
        run: npm ci || npm install
      - name: Tests with coverage
        working-directory: client
        run: npm run test:coverage
      - name: Keep the coverage report
        uses: actions/upload-artifact@v4
        with:
          name: client-coverage
          path: client/coverage
          if-no-files-found: ignore

  build:
    name: Build client
    needs: [lint, server-tests, client-tests]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: client/package-lock.json
      - name: Install
        working-directory: client
        run: npm ci || npm install
      - name: Build
        working-directory: client
        env:
          NEXT_TELEMETRY_DISABLED: 1
          NEXT_PUBLIC_API_URL: http://localhost:4000/api
        run: npm run build
